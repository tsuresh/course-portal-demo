<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #0F1A2E; background: #F7F4EE; }
    h1 { margin-bottom: 4px; }
    p.hint { color: #535C70; margin-top: 0; }
    .course { background: #fff; border: 1px solid #D9D1C2; border-radius: 12px; padding: 16px 20px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
    .course small { color: #535C70; }
    button { background: #EB5A24; color: #0F1A2E; border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    input { padding: 8px; border-radius: 8px; border: 1px solid #535C70; width: 120px; }
    #status { margin-top: 16px; padding: 12px 16px; border-radius: 8px; background: #fff; border: 1px solid #D9D1C2; font-family: ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Course Portal</h1>
  <p class="hint">This page is the frontend. Every button sends a request to the Express backend. Open DevTools, Network tab, to watch it.</p>

  <label>Student ID <input id="studentId" type="number" value="42" min="1"></label>

  <div id="courses">Loading courses...</div>
  <div id="status">Responses from the server will appear here.</div>

  <script>
    const coursesEl = document.getElementById('courses');
    const statusEl = document.getElementById('status');

    // GET /api/courses, then draw the list
    async function loadCourses() {
      const res = await fetch('/api/courses');
      const courses = await res.json();
      coursesEl.innerHTML = '';
      for (const course of courses) {
        const row = document.createElement('div');
        row.className = 'course';
        row.innerHTML = `<div><strong>${course.code}</strong> ${course.title}<br><small>${course.seatsLeft} of ${course.seats} seats left</small></div>`;
        const button = document.createElement('button');
        button.textContent = 'Enrol';
        button.onclick = () => enrolIn(course.code, button);
        row.appendChild(button);
        coursesEl.appendChild(row);
      }
    }

    // POST /api/enrolments, then show the status code and body
    async function enrolIn(courseCode, button) {
      button.disabled = true;                         // loading state
      statusEl.textContent = 'Sending request...';
      const studentId = Number(document.getElementById('studentId').value);
      try {
        const res = await fetch('/api/enrolments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, courseCode }),
        });
        const body = await res.json();
        statusEl.textContent = `${res.status} ${res.statusText}\n${JSON.stringify(body, null, 2)}`; // success or error state
        await loadCourses();
      } catch (err) {
        statusEl.textContent = 'Could not reach the server. Is it running?';
      } finally {
        button.disabled = false;
      }
    }

    loadCourses();
  </script>
</body>
</html>
